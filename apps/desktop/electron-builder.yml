appId: co.jinion.desktop
productName: Jinion
# The agents' programs (claude, codex) are spawned from disk, which a file inside an asar archive can't be.
asar: false
# The app folder comes from `pnpm deploy`, already holding what it needs; nothing in it builds native code.
npmRebuild: false
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64]
    # What the app's updater downloads; the dmg is for the first install.
    - target: zip
      arch: [arm64]
  # Signed with the Developer ID Application certificate in the keychain, every binary inside too, and notarized with
  # the notarytool profile `scripts/package.ts` names.
  notarize: true
dmg:
  title: Jinion ${version}
# Where the app looks for a newer version: a release of its own that holds only `latest-mac.yml`, since GitHub marks the
# latest release of any product as the latest. Each desktop release replaces the file there.
publish:
  provider: generic
  url: https://github.com/itsemirhanengin/jinion/releases/download/desktop-latest
